# relay.example.com — Hermes Relay
#
# 后端 server.py        → 127.0.0.1:8788
# 前端 Next.js standalone → 127.0.0.1:3220
#
# 关键点：/api/ 段必须关掉缓冲 —— SSE 是 POST 长连接，缓冲会把字攒住，
#         看起来像「想半天然后一下子全蹦出来」。
#
# 登录：本配置默认不启用登录（假设只有你能访问，或前面已有网关）。
#       文件里带「可选」注释的那几处，是自建 cookie 网关（127.0.0.1:3190）的接法；
#       要用就取消注释，不用就连同各 location 里的 auth_request / error_page 两行一起删掉。

server {
    listen 80;
    listen [::]:80;
    server_name relay.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name relay.example.com;

    # 证书换成你自己的
    ssl_certificate     /etc/ssl/example.com-origin.pem;
    ssl_certificate_key /etc/ssl/example.com-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 64M;      # 附件上传上限

    proxy_connect_timeout 30s;
    proxy_read_timeout 3600s;      # 长回答可能跑很久，别让 nginx 先断了
    proxy_send_timeout 3600s;
    proxy_request_buffering off;

    # 用 Cloudflare 时打开：信任 CF 回源 IP 段，才能拿到真实客户端 IP
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # --- 可选：登录网关。不需要就整段删掉 ---
    # location = /auth/verify {
    #     internal;
    #     proxy_pass http://127.0.0.1:3190/auth/verify;
    #     proxy_pass_request_body off;
    #     proxy_set_header Content-Length "";
    #     proxy_set_header Cookie $http_cookie;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
    # location /auth/ {
    #     proxy_pass http://127.0.0.1:3190;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto https;
    # }
    # location @auth_login {
    #     return 302 /auth/login?next=$request_uri;
    # }

    # --- API：走后端，含 SSE 流式对话，必须不缓冲 ---
    location /api/ {
        # auth_request /auth/verify;        # 可选，见上
        # error_page 401 = @auth_login;     # 可选，见上

        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
    }

    # --- 带内容哈希的构建产物：可以放心长缓存 ---
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, max-age=31536000, immutable" always;
    }

    # --- 其余都发给前端 ---
    location / {
        # auth_request /auth/verify;        # 可选，见上
        # error_page 401 = @auth_login;     # 可选，见上

        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # HTML 必须 no-store：否则浏览器（以及中间的 CDN）缓存一整天，
        # 重新构建的界面根本看不到。
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
    }
}
